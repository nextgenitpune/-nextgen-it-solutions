<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>NEXTGEN Admin</title><style>body{font:16px Arial;background:#eff6ff;color:#12365e;margin:0}main{max-width:820px;margin:35px auto;padding:20px}section{background:white;border-radius:14px;padding:24px;margin-bottom:20px;box-shadow:0 4px 15px #1232}input,select,textarea,button{font:inherit;padding:12px;margin:6px 0;width:100%;box-sizing:border-box;border:1px solid #ccd7e6;border-radius:8px}button{background:#1264bd;color:white;cursor:pointer}button.secondary{background:#566b80}.hide{display:none}.item{border-bottom:1px solid #ddd;padding:12px 0}small{color:#576c80}</style></head><body><main><h1>NEXTGEN IT SOLUTIONS — Admin</h1><section id="login"><h2>Email OTP Login</h2><input id="email" type="email" placeholder="Admin email"><button id="send">Send OTP</button><input id="code" inputmode="numeric" maxlength="6" placeholder="6-digit OTP"><button id="verify">Verify & Login</button></section><section id="panel" class="hide"><button class="secondary" id="logout">Logout</button><h2>Product Management</h2><form id="form"><input type="hidden" id="pid"><input id="name" placeholder="Product name" required><select id="category"><option value="laptop">Laptop</option><option value="desktop">Desktop</option><option value="printer">Printer</option><option value="cctv">CCTV</option><option value="accessories">Accessories</option></select><select id="condition"><option value="new">New</option><option value="refurbished">Refurbished</option></select><input id="brand" list="brands" placeholder="Brand (e.g. Brother, HP, Dell)" required><datalist id="brands"><option value="HP"><option value="Dell"><option value="Lenovo"><option value="Asus"><option value="Acer"><option value="Apple"><option value="Brother"><option value="Canon"><option value="Epson"><option value="Samsung"><option value="Hikvision"><option value="CP Plus"><option value="Dahua"><option value="Logitech"></datalist><input id="model" placeholder="Model (e.g. T430)" required><textarea id="description" placeholder="Specifications / description"></textarea><input id="price" type="number" min="0" step="0.01" placeholder="Price (optional)"><input id="image_url" type="url" placeholder="Public image URL (optional)"><input id="warranty" placeholder="Warranty details"><label><input id="active" type="checkbox" checked style="width:auto"> Visible on website</label><button>Save Product</button><button type="button" class="secondary" id="clear">Clear Form</button></form><h2>Products</h2><div id="products"></div></section><p id="msg" role="status"></p><p><a href="/">← Back to website</a></p></main><script>
const $=id=>document.getElementById(id);let products=[];const api=async(path,method='GET',body)=>{const r=await fetch('/api'+path,{method,headers:{'content-type':'application/json'},credentials:'same-origin',body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d};const notify=t=>$('msg').textContent=t;const view=ok=>{$('login').classList.toggle('hide',ok);$('panel').classList.toggle('hide',!ok)};async function load(){try{products=(await api('/admin/products')).products;const root=$('products');root.replaceChildren();for(const p of products){const div=document.createElement('div');div.className='item';const name=document.createElement('strong');name.textContent=p.name;const info=document.createElement('small');info.textContent=' — '+p.category+' / '+(p.brand||'Unassigned')+' / '+(p.model||p.name)+(p.price!=null?' ₹'+p.price:'')+(p.active?'':' (hidden)');const edit=document.createElement('button');edit.textContent='Edit';edit.onclick=()=>{for(const k of ['name','category','condition','brand','model','description','price','image_url','warranty'])$(k).value=p[k]??'';$('pid').value=p.id;$('active').checked=!!p.active;window.scrollTo(0,0)};const del=document.createElement('button');del.textContent='Delete';del.className='secondary';del.onclick=async()=>{if(confirm('Delete '+p.name+'?')){try{await api('/admin/products/'+p.id,'DELETE');await load()}catch(e){notify(e.message)}}};div.append(name,info,edit,del);root.append(div)}}catch(e){notify(e.message)}}
$('send').onclick=async()=>{try{notify((await api('/auth/request','POST',{email:$('email').value})).message)}catch(e){notify(e.message)}};$('verify').onclick=async()=>{try{await api('/auth/verify','POST',{email:$('email').value,code:$('code').value});view(true);notify('Logged in');await load()}catch(e){notify(e.message)}};$('logout').onclick=async()=>{await api('/auth/logout','POST');view(false);notify('Logged out')};$('clear').onclick=()=>{$('form').reset();$('pid').value=''};$('form').onsubmit=async e=>{e.preventDefault();const b={};for(const k of ['name','category','condition','brand','model','description','price','image_url','warranty'])b[k]=$(k).value;b.active=$('active').checked?1:0;try{const id=$('pid').value;await api('/admin/products'+(id?'/'+id:''),id?'PUT':'POST',b);$('clear').click();notify('Product saved');await load()}catch(e){notify(e.message)}};api('/auth/status').then(d=>{view(d.authenticated);if(d.authenticated)load()}).catch(e=>notify(e.message));
</script></body></html>
